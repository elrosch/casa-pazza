name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.6

jobs:
  check:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test and build server
        working-directory: server
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go build -o /tmp/pb/pocketbase .
      - name: Start PocketBase with repo schema
        run: |
          /tmp/pb/pocketbase serve --http=127.0.0.1:8090 --dir=/tmp/pb_data \
            --migrationsDir=server/pb_migrations --hooksDir=server/pb_hooks > /tmp/pb.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8090/api/health && break; sleep 0.25; done
      - run: flutter test
        env:
          PB_TEST_URL: http://127.0.0.1:8090

  build-android:
    name: Build Android
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  build-ios:
    name: Build iOS (unsigned)
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build ios --debug --no-codesign
